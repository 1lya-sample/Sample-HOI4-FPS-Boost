; Sample HOI4 FPS Boost settings: 1 = on, 0 = off. Every setting is described in README.md (Settings).

[memory]
mimalloc=1
large_pages=1
reserve_huge_gib=0

[cpu]
isolate_main_core=1
boost_main_priority=1

[patches]
enabled=1
wake_all_workers=1
frame_pacing=1
target_fps=75
adaptive_fps=1
idle_fps=30
idle_after_ms=2000
province_throttle=1
worker_spin=1
spin_iters=2000

[controls]
mp_space_pause=1
